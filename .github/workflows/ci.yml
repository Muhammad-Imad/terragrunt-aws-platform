name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VERSION: "1.9.5"
  TG_VERSION: "0.67.4"

jobs:
  fmt-lint:
    name: fmt + lint + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terragrunt hclfmt
        run: terragrunt hclfmt --terragrunt-check --terragrunt-diff

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          soft_fail: true
          additional_args: --minimum-severity HIGH

  validate:
    name: validate (${{ matrix.unit }})
    runs-on: ubuntu-latest
    needs: fmt-lint
    strategy:
      fail-fast: false
      matrix:
        unit:
          - accounts/shared-services/eu-central-1/vpc
          - accounts/shared-services/eu-central-1/eks
          - accounts/prod/eu-central-1/vpc
          - accounts/prod/eu-central-1/eks
          - accounts/prod/eu-central-1/s3-cloudfront
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      # Validate without touching real backends or cloud credentials. Mock
      # dependency outputs (declared in _envcommon) let `validate` resolve the
      # vpc -> eks graph on a clean checkout.
      - name: terragrunt validate
        working-directory: ${{ matrix.unit }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          # Init providers WITHOUT a backend or cloud creds; dependency mock_outputs
          # (declared in _envcommon) resolve the vpc -> eks graph on a clean checkout.
          terragrunt init -backend=false
          terragrunt validate
